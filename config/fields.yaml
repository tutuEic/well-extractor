# 地下水统测信息提取器 - 字段映射配置
# 左侧为 OCR 识别到的标签关键词，右侧对应模板 Excel 列

template:
  path: "D:/地下水/大同朔州忻州_地下水统测表_补全_最终版.xlsx"
  sheet: "Sheet1"
  header_row: 1
  data_start_row: 2

output_columns:
  # 模板列 → 提取字段
  A: "序号"           # auto-generated
  B: "统一编号"
  C: "野外编号"
  D: "路线编号"
  E: "调查日期"
  F: "地理位置"
  G: "天气"
  H: "经度"           # 不使用图片提取值！从已有数据或手动填写
  I: "纬度"           # 不使用图片提取值！
  J: "X"
  K: "Y"
  L: "地面高程"
  M: "地面高程获取方法"
  N: "测点高程"
  O: "测点高程获取方法"
  P: "井台高度"
  Q: "井深"
  R: "地下水资源区名称"
  S: "所属统测区类型"
  T: "井点类型"
  U: "测点距地面高度"
  V: "地下水位埋深"
  W: "测点距水面距离"
  X: "水位标高"
  Y: "地下水类型（按含水介质）"
  Z: "地下水类型（按埋藏深度）"
  AA: "地下水类型（按承压性）"
  AB: "统测期"
  AC: "统测区所属统测期次类型"
  AD: "照片编号"
  AF: "备注"

# OCR 标签 → 模板列的映射
field_mapping:
  # 编号类
  野外编号: C
  统一编号: B
  路线编号: D
  
  # 日期
  统测日期: E
  调查日期: E
  
  # 位置
  地理位置: F
  天气: G
  
  # 坐标（不提取，跳过）
  # 经度: H
  # 纬度: I
  
  # 高程
  地面高程: L
  测点高程: N
  地面高程获取方法: M
  测点高程获取方法: O
  
  # 井参数
  井台高度: P
  井深: Q
  测点距地面高度: U
  地下水位埋深: V
  地下埋深: V
  测点距水面距离: W
  
  # 类型分类
  井点类型: T
  所属统测区类型: S
  统测期: AB
  统测区统测期次类型: AC
  统测期次类型: AC
  
  # 地下水类型
  "地下水类型（按含水介质）": Y
  "地下水类型按含水介质": Y
  "含水介质": Y
  "地下水类型（按埋藏深度）": Z
  "地下水类型按埋藏深度": Z
  "埋藏深度": Z
  "地下水类型（按承压性）": AA
  "地下水类型按承压性": AA
  "承压性": AA
  
  # 人员
  测量人: AH
  记录人: AI
  审核人: AJ
  
  # 其他
  统测实施单位: AG
  地下水资源区名称: R
  备注: AF
  照片编号: AD

# 固定值（所有记录共用）
defaults:
  路线编号: ""
  统测实施单位: "山西省地质调查院有限公司"
  测量人: "杨光"
  记录人: "杨升伟"
  审核人: "杨升伟"
  地面高程获取方法: "RTK"
  测点高程获取方法: "RTK"

# 提取规则
rules:
  skip_coordinates: true  # 不使用图片中的经纬度
  date_format: "YYYYMMDD"
  numeric_fields: ["井台高度", "井深", "测点距地面高度", "地下水位埋深", "测点距水面距离", "地面高程", "测点高程"]
